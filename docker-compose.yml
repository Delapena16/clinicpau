services:
  drpau-mongo:
    image: mongo:latest
    container_name: drpau-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  drpau-app:
    build: .
    container_name: drpau-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      drpau-mongo:
        condition: service_healthy
    # Secrets (JWT_SECRET, SMTP/Gmail credentials) are read from the local .env at runtime.
    # Values under "environment" below take precedence over the .env file.
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_URI: mongodb://drpau-mongo:27017/drpau_abtc
      PORT: "5000"
      CLIENT_ORIGIN: http://localhost:5000
      # Keep "development" while serving over plain HTTP (localhost / defense demo).
      # Switch to "production" only behind HTTPS — production sets the auth cookie
      # to secure-only, disables the 000000 MFA override, and tightens rate limits.
      NODE_ENV: development

volumes:
  mongo_data:
